name: Monthly model retrain

# Retrains the safety-score model on the latest City of Cincinnati
# reported-crime data on the 1st of each month, and commits the refreshed
# model artifacts. Streamlit Community Cloud redeploys automatically on push.
# Can also be run manually from the Actions tab.

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install training dependencies
        run: pip install pandas numpy scikit-learn imbalanced-learn joblib requests

      - name: Retrain
        run: python train_model.py

      - name: Commit refreshed model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/
          if git diff --cached --quiet; then
            echo "Model artifacts unchanged, nothing to commit."
          else
            git commit -m "Monthly retrain: refresh model artifacts"
            git push
          fi
